<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const tab = st.tab || 'hoodie';
const sel = Object.assign({ skin: 1, hair: 0, hoodie: 0, pants: 0, shoes: 0 }, st.sel || {});
const extras = st.extras || {};
const cat = {
skin: [
{ label: 'Tone 1', v: '#F6D3BA' }, { label: 'Tone 2', v: '#EBBE9C' }, { label: 'Tone 3', v: '#C98E65' },
{ label: 'Tone 4', v: '#9A6243' }, { label: 'Tone 5', v: '#6B412B' }
],
hair: [
{ label: 'Buzz', v: '#D9CBB8', style: 'buzz' }, { label: 'Crop', v: '#2A1E1A', style: 'crop' },
{ label: 'Curls', v: '#5A3825', style: 'curls' }, { label: 'Top knot', v: '#1E1A24', style: 'knot' },
{ label: 'Lilac crop', v: '#B79CFF', style: 'crop', lock: 'Lv 20' }
],
hoodie: [
{ label: 'Amethyst', v: '#6F42E8', shade: '#5227C9' }, { label: 'Midnight', v: '#2B2350', shade: '#1B1538' },
{ label: 'Ember', v: '#E8662A', shade: '#C24E17' }, { label: 'Mint', v: '#3BBF9A', shade: '#279878' },
{ label: 'Rose', v: '#E0508F', shade: '#BF3A74' }, { label: 'Gold', v: '#E8B530', shade: '#C7951A', lock: 'Lv 20' }
],
pants: [
{ label: 'Amethyst', v: '#5227C9', stripe: 1 }, { label: 'Charcoal', v: '#3A3548', stripe: 1 },
{ label: 'Sand', v: '#CDB38A', stripe: 0 }, { label: 'Denim', v: '#3F63A8', stripe: 0 }
],
shoes: [
{ label: 'Classic', v: '#FFFFFF', accent: '#6F42E8' }, { label: 'Blackout', v: '#2B2350', accent: '#FFFFFF' },
{ label: 'Ember', v: '#FFFFFF', accent: '#E8662A' }, { label: 'Neon', v: '#D8FF3D', accent: '#241257', lock: '150 Shards' }
],
extras: [
{ key: 'cap', label: 'Cap', p1: 'M4 15a8 8 0 0 1 16 0z', p2: 'M3 15h19' },
{ key: 'glasses', label: 'Glasses', p1: 'M2 13a4 4 0 1 0 8 0 4 4 0 1 0-8 0M14 13a4 4 0 1 0 8 0 4 4 0 1 0-8 0', p2: 'M10 13h4' },
{ key: 'phones', label: 'Headphones', p1: 'M3 18v-6a9 9 0 0 1 18 0v6', p2: 'M3 14h4v6H3zM17 14h4v6h-4z' },
{ key: 'band', label: 'Sweatband', p1: 'M3 13c0-5 4-8 9-8s9 3 9 8', p2: 'M4 11h16' },
{ key: 'crown', label: 'Crown', p1: 'M2 18h20l-2-11-5 5-3-7-3 7-5-5z', p2: '', lock: 'Chest reward' }
]
};
const hair = cat.hair[sel.hair], hood = cat.hoodie[sel.hoodie], pants = cat.pants[sel.pants], shoe = cat.shoes[sel.shoes];
const on = (b) => (b ? 1 : 0);
const c = {
skin: cat.skin[sel.skin].v, hair: hair.v,
hBuzz: on(hair.style === 'buzz' && !extras.cap), hCrop: on(hair.style === 'crop' && !extras.cap),
hCurls: on(hair.style === 'curls' && !extras.cap), hKnot: on(hair.style === 'knot' && !extras.cap),
hoodie: hood.v, hoodieShade: hood.shade, pants: pants.v, stripe: pants.stripe,
shoe: shoe.v, shoeAccent: shoe.accent,
xCap: on(extras.cap), xGlasses: on(extras.glasses), xPhones: on(extras.phones), xBand: on(extras.band && !extras.cap)
};
const tabList = [['skin', 'Skin'], ['hair', 'Hair'], ['hoodie', 'Top'], ['pants', 'Pants'], ['shoes', 'Shoes'], ['extras', 'Extras']];
const tabBase = 'flex-grow: 1; min-height: 44px; padding: 0 4px; border-radius: 12px; font-family: Nunito, ui-rounded, system-ui, sans-serif; font-size: 13px; font-weight: 800; cursor: pointer; ';
const optBase = 'min-height: 92px; padding: 8px 4px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-family: inherit; ';
const opts = cat[tab].map((o, i) => {
const locked = !!o.lock;
const picked = tab === 'extras' ? !!extras[o.key] : sel[tab] === i;
return {
label: o.label, lock: o.lock || '', locked: locked,
aria: o.label + (locked ? ', locked: ' + o.lock : ''),
pressed: picked ? 'true' : 'false',
isColor: tab !== 'extras', isIcon: tab === 'extras', p1: o.p1 || '', p2: o.p2 || '',
swatch: 'width: 34px; height: 34px; border-radius: 50%; background: ' + o.v + '; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px ' + (picked ? '#6F42E8' : '#DCD2FA') + (locked ? '; opacity: 0.45' : ''),
style: optBase + (locked ? 'background: #F4F0FF; border: 2px dashed #CFC0FF; cursor: not-allowed' : picked ? 'background: #EDE6FF; border: 2px solid #8A66F2; box-shadow: 0 3px 0 #8A66F2; cursor: pointer' : 'background: #FFFFFF; border: 2px solid #E6DEFF; box-shadow: 0 3px 0 #E6DEFF; cursor: pointer'),
pick: () => {
if (locked) return;
if (tab === 'extras') {
const next = Object.assign({}, extras); next[o.key] = !extras[o.key];
this.setState({ extras: next });
} else {
const next = Object.assign({}, sel); next[tab] = i;
this.setState({ sel: next });
}
}
};
});
return {
c: c,
opts: opts,
tabs: tabList.map((t) => ({
label: t[1], pressed: t[0] === tab ? 'true' : 'false',
style: tabBase + (t[0] === tab ? 'background: #6F42E8; color: #FFFFFF; border: 2px solid #6F42E8; box-shadow: 0 3px 0 #4F25C4' : 'background: #FFFFFF; color: #241257; border: 2px solid #E6DEFF'),
pick: () => this.setState({ tab: t[0] })
}))
};
}
}
