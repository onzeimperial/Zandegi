const base = 'min-height: 44px; padding: 0 16px; border-radius: 14px; font-family: Nunito, ui-rounded, system-ui, sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; ';
const off = base + 'background: #FFFFFF; color: #241257; border: 2px solid #E6DEFF; box-shadow: 0 3px 0 #E6DEFF';
const on = base + 'background: #EDE6FF; color: #5227C9; border: 2px solid #8A66F2; box-shadow: 0 3px 0 #8A66F2';
const labels = ['Bench 100 kg', 'Get into medicine', 'Learn Farsi', 'Save a house deposit', 'Stop doom-scrolling', 'Start a business'];
return {
chips: labels.map((label) => ({
label: label,
pressed: label === sel ? 'true' : 'false',
style: label === sel ? on : off,
pick: () => this.setState({ sel: label })
}))
};
}
}
</script>
