<style>
body{margin:0;font-family:'Nunito',ui-rounded,system-ui,sans-serif;background:#FFFFFF;color:#241257}
a{color:#6F42E8;text-decoration:none}a:hover{color:#5227C9}
.d{font-family:'Baloo 2',ui-rounded,system-ui,sans-serif}
input,textarea{font-family:inherit}
@keyframes zspin{to{transform:rotate(360deg)}}
@keyframes zbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes zidle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; overflow: hidden; background: #FFFFFF">
<div style="width: 720px; flex-shrink: 0; background: #5B30D6; background-image: radial-gradient(circle at 50% 40%, #8A66F2 0, #5B30D6 60%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<img src="78404bd2-193a-4474-b1f9-a00fcbdf8a76" alt="Zandegi mascot" style="width: 260px; height: 260px; border-radius: 50%; object-fit: cover; object-position: 50% 18%; border: 8px solid #FFFFFF; box-shadow: 0 10px 0 #3E1BA6; animation: zbob 2.6s ease-in-out infinite">
<div class="d" style="font-size: 76px; font-weight: 800; color: #FFFFFF; line-height: 1; margin-top: 22px">zandegi</div>
<div style="font-size: 24px; font-weight: 800; color: #E2D8FF">Level up your real life.</div>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 420px; display: flex; flex-direction: column; gap: 16px">
<div role="group" aria-label="Choose" style="display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: #F4F0FF; border: 2px solid #E6DEFF">
<button aria-pressed="{{signupPressed}}" sc-camel-on-click="{{toSignup}}" style="{{signupTab}}">Sign up</button>
<button aria-pressed="{{loginPressed}}" sc-camel-on-click="{{toLogin}}" style="{{loginTab}}">Log in</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 800; color: #241257">Email</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid #CFC0FF; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 700; color: #241257; outline-color: #6F42E8">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="password" style="font-size: 14px; font-weight: 800; color: #241257">Password</label>
<sc-if value="{{isLogin}}" hint-placeholder-val="{{ false }}">
<a href="#" style="font-size: 14px; font-weight: 800; padding: 4px 0">Forgot password?</a>
</sc-if>
</div>
<div style="position: relative; display: flex">
<input id="password" type="{{pwType}}" autocomplete="{{pwAuto}}" placeholder="{{pwHint}}" style="flex-grow: 1; height: 52px; box-sizing: border-box; border-radius: 14px; border: 2px solid #CFC0FF; background: #FFFFFF; padding: 0 56px 0 14px; font-family: inherit; font-size: 16px; font-weight: 700; color: #241257; outline-color: #6F42E8">
<button sc-camel-on-click="{{toggleShow}}" aria-label="{{showLabel}}" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #6B6390; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
</div>

<sc-if value="{{isSignup}}" hint-placeholder-val="{{ true }}">
<a href="WebOnboarding.dc.html" class="d" style="height: 56px; margin-top: 4px; border-radius: 16px; background: #6F42E8; box-shadow: 0 5px 0 #4F25C4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; letter-spacing: 0.06em">CREATE ACCOUNT</a>
</sc-if>
<sc-if value="{{isLogin}}" hint-placeholder-val="{{ false }}">
<a href="WebMain.dc.html" class="d" style="height: 56px; margin-top: 4px; border-radius: 16px; background: #6F42E8; box-shadow: 0 5px 0 #4F25C4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; letter-spacing: 0.06em">LOG IN</a>
</sc-if>

<div style="display: flex; align-items: center; gap: 10px">
<div style="flex-grow: 1; height: 2px; background: #E6DEFF"></div>
<span style="font-size: 13px; font-weight: 800; color: #6B6390">or</span>
<div style="flex-grow: 1; height: 2px; background: #E6DEFF"></div>

const st = this.state || {};

const off = base + 'background: transparent; color: #6B6390; border: 2px solid transparent';
return {
isLogin: login, isSignup: !login,
signupPressed: login ? 'false' : 'true', loginPressed: login ? 'true' : 'false',
signupTab: login ? off : on, loginTab: login ? on : off,
toSignup: () => this.setState({ mode: 'signup' }),
toLogin: () => this.setState({ mode: 'login' }),
pwType: show ? 'text' : 'password',
pwAuto: login ? 'current-password' : 'new-password',
pwHint: login ? 'Your password' : 'At least 8 characters',
showLabel: show ? 'Hide password' : 'Show password',
toggleShow: () => this.setState({ show: !show })
};
}
}
