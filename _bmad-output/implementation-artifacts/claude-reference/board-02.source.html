<div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
<span style="font-size: 15px; font-weight: 800; color: #241257">{{s.title}}</span>
<sc-if value="{{s.showDetail}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 13px; font-weight: 700; color: #6B6390; text-wrap: pretty">{{s.detail}}</span>
</sc-if>
</div>
</li>
</sc-for>
</ol>
<sc-if value="{{finished}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<a href="WebPlan.dc.html" class="d" style="height: 56px; border-radius: 16px; background: #6F42E8; box-shadow: 0 5px 0 #4F25C4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; letter-spacing: 0.06em">SEE MY MISSION</a>
<button sc-camel-on-click="{{replay}}" style="height: 44px; border: 0; background: transparent; color: #5227C9; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Replay the build</button>
</div>
</sc-if>
<sc-if value="{{working}}" hint-placeholder-val="{{ false }}">
<div class="d" style="height: 56px; border-radius: 16px; background: #E3DCF7; color: #5227C9; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; letter-spacing: 0.04em">BUILDING · {{doneCount}} OF 5</div>
</sc-if>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
componentDidMount() {
this.start();
}
componentWillUnmount() {
clearInterval(this.timer);
}
start() {
clearInterval(this.timer);
this.setState({ stage: 0 });
this.timer = setInterval(() => {
const s = (this.state && this.state.stage) || 0;
if (s >= 5) { clearInterval(this.timer); return; }
this.setState({ stage: s + 1 });
}, 1300);
}
renderVals() {
const stage = (this.state && typeof this.state.stage === 'number') ? this.state.stage : 5;
const list = [
{ title: 'Reading your ambition', detail: 'Metric goal: bench press one-rep max, target 100 kg.' },
{ title: 'Finding your starting point', detail: 'Best lift 72.5 kg. 4 evenings a week free in your calendar.' },
{ title: 'Splitting it into chapters', detail: '5 chapters. Each one ends in a mini-goal you can prove.' },
{ title: 'Booking time blocks', detail: '3 sessions a week, added to your calendar.' },
{ title: 'Checking facts and scoring', detail: 'Rules are sourced or marked as advice. XP is set by fixed formulas, not the AI.' }
];
const bubbles = ['Give me a sec. I’m planning your mission.', 'Got it. Let’s see where you’re starting.', 'Breaking it into mini-goals…', 'Finding time in your week…', 'Double-checking everything…', 'Done! Your mission is ready.'];
return {
bubble: bubbles[Math.min(stage, 5)],
finished: stage >= 5,
working: stage < 5,
doneCount: stage,
replay: () => this.start(),
stages: list.map((x, i) => {
const done = i < stage, active = i === stage;
return {
n: i + 1, title: x.title, detail: x.detail,
done: done, active: active, pending: !done && !active, showDetail: done,
rowStyle: 'min-height: 52px; box-sizing: border-box; padding: 10px 12px; border-radius: 14px; display: flex; align-items: center; gap: 12px; ' + (active ? 'background: #FFFFFF; border: 2px solid #8A66F2; box-shadow: 0 3px 0 #CFC0FF' : done ? 'background: #FFFFFF; border: 2px solid #E6DEFF' : 'background: transparent; border: 2px dashed #DCD2FA')
};
})
};
}
}
</script>


</body></html>
